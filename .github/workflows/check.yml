name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install shellcheck and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Run checks
        run: make check
